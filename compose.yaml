name: korcounsel
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: korcounsel-backend:scaffold
    build: ./backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      DATA_DIR: /data
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:8080}
      KORCOUNSEL_ADMIN_ID: ${KORCOUNSEL_ADMIN_ID:-}
      KORCOUNSEL_ADMIN_PASSWORD: ${KORCOUNSEL_ADMIN_PASSWORD:-}
      KORCOUNSEL_DEV_EDITOR_ID: ${KORCOUNSEL_DEV_EDITOR_ID:-}
      KORCOUNSEL_DEV_EDITOR_PASSWORD: ${KORCOUNSEL_DEV_EDITOR_PASSWORD:-}
    volumes:
      - case_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    image: korcounsel-web:scaffold
    build:
      context: .
      dockerfile: .fordeploy/frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./.fordeploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
  worker:
    image: korcounsel-backend:scaffold
    build: ./backend
    command: ["klegal", "ops", "worker"]
    init: true
    restart: unless-stopped
    stop_grace_period: 130s
    healthcheck:
      test: ["CMD", "klegal", "ops", "worker-health"]
      interval: 15s
      timeout: 5s
      retries: 4
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      DATA_DIR: /data
    volumes:
      - case_data:/data
    depends_on:
      postgres:
        condition: service_healthy
  migrate:
    image: korcounsel-backend:scaffold
    build: ./backend
    profiles: ["tools"]
    command: ["klegal", "ops", "migrate"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  case_data:
