name: korcounsel
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: korcounsel-backend:scaffold
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DATA_DIR: /data
    volumes:
      - case_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    image: korcounsel-web:scaffold
    build:
      context: .
      dockerfile: .fordeploy/frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./.fordeploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
  worker:
    image: korcounsel-backend:scaffold
    build: ./backend
    profiles: ["tools"]
    command: ["klegal", "check-db"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DATA_DIR: /data
    volumes:
      - case_data:/data
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  case_data:
